<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnView - Sign Up</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f6ff;
      text-align: center;
      padding: 30px 20px;
    }

    .card {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      color: #1677ff;
    }

    input {
      width: 90%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #1677ff;
      color: white;
      border: none;
      padding: 13px 30px;
      margin-top: 15px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Create Account</h1>

    <p>Join EarnView</p>

    <input type="text" placeholder="Full name">

    <input type="email" placeholder="Email address">

    <input type="password" placeholder="Password">

    <br>

    <button>Create Account</button>

    <p>Already have an account? Log in</p>
  </div>

</body>
  </html>
