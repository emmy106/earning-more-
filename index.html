<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EarnView</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f6ff;
      color: #222;
      text-align: center;
    }

    header {
      background: #1677ff;
      color: white;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 16px;
    }

    .container {
      padding: 40px 20px;
    }

    .card {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #1677ff;
    }

    .card p {
      color: #555;
      line-height: 1.6;
    }

    button {
      background: #1677ff;
      color: white;
      border: none;
      padding: 13px 25px;
      margin: 8px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .login {
      background: white;
      color: #1677ff;
      border: 2px solid #1677ff;
    }

    .features {
      margin-top: 30px;
      text-align: left;
    }

    .feature {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>EarnView</h1>
    <p>Complete sponsored tasks and earn points</p>
  </header>

  <div class="container">

    <div class="card">

      <h2>Welcome to EarnView 👋</h2>

      <p>
        Complete available sponsored tasks and activities
        to collect points in your EarnView account.
      </p>

      <button>Sign Up</button>

      <button class="login">Log In</button>

      <div class="features">

        <div class="feature">🎯 Complete tasks</div>

        <div class="feature">⭐ Collect points</div>

        <div class="feature">💰 Track your rewards</div>

        <div class="feature">📊 View your activity</div>

      </div>

    </div>

  </div>

  <footer>
    © 2026 EarnView
  </footer>

</body>
</html>
